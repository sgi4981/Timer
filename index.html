<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CNM Timer</title>
<style>
  :root {
    color-scheme: light dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #f4f4f6;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page {
    width: min(1100px, 100%);
    display: grid;
    grid-template-columns: 1.3fr 0.7fr;
    gap: 2rem;
    padding: 2rem;
  }

  .timer-panel {
    padding-left: 1rem;
  }

  .image-panel {
    position: relative;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
    min-height: 620px;
    background: #000;
  }

  .image-panel img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .timer-panel {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .timer-card {
    width: 100%;
    max-width: 460px;
    min-height: 560px;
    border-radius: 30px;
    background: rgba(18, 20, 28, 0.92);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  .timer-layout {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.75rem;
  }

  .clock {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.96);
    display: grid;
    place-items: center;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35), 0 20px 45px rgba(0, 0, 0, 0.2);
    color: #111;
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    position: relative;
    overflow: hidden;
  }

  .ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring circle {
    fill: none;
    stroke-width: 10;
  }

  .ring-track {
    stroke: rgba(0, 0, 0, 0.08);
  }

  .ring-progress {
    stroke: #1b7f3b;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.25s ease;
  }

  .clock::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.12);
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    width: 100%;
  }

  .controls h1 {
    margin: 0;
    font-size: 1.65rem;
    font-weight: 800;
    line-height: 1.1;
    width: 100%;
    text-align: center;
  }

  .inputs {
    display: grid;
    gap: 0.85rem;
    width: 100%;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .field label {
    font-size: 0.85rem;
    color: #c8c9cf;
  }

  input[type="number"] {
    width: 100%;
    min-width: 110px;
    padding: 0.55rem 0.75rem;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.96);
    color: #111;
    font-size: 1.1rem;
    text-align: center;
  }

  input[type="number"]::placeholder {
    color: rgba(17, 17, 17, 0.45);
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: 100%;
  }

  .buttons button {
    width: 100%;
  }

  button {
    border: none;
    border-radius: 12px;
    padding: 0.65rem 1rem;
    font-size: 0.96rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  button:hover:not(:disabled) {
    transform: translateY(-1px);
    opacity: 0.95;
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  #startBtn { background: #1b7f3b; color: #fff; }
  #pauseBtn { background: #cb9b1b; color: #111; }
  #resetBtn { background: #b3261e; color: #fff; }

  .display.done {
    color: #b3261e;
  }

  .time-text {
    position: relative;
    z-index: 1;
  }

  @media (max-width: 980px) {
    .page {
      grid-template-columns: 1fr;
      padding: 1.5rem;
    }

    .image-panel {
      min-height: 420px;
    }

    .timer-layout {
      grid-template-columns: 1fr;
      justify-items: center;
    }

    .controls {
      align-items: center;
      text-align: center;
    }

    .controls h1 {
      font-size: 1.5rem;
    }

    .inputs {
      width: 100%;
    }

    .buttons {
      width: 100%;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="image-panel">
      <img src="NinjasatDesk.png" alt="Ninjas at desk">
    </div>
    <div class="timer-panel">
      <div class="timer-card">
            <div class="timer-layout">
          <div class="controls">
            <h1>Timer</h1>
            <div class="clock" id="display">
              <svg class="ring" viewBox="0 0 260 260" aria-hidden="true">
                <circle class="ring-track" cx="130" cy="130" r="112" />
                <circle class="ring-progress" cx="130" cy="130" r="112" stroke-dasharray="703" stroke-dashoffset="703" />
              </svg>
              <span class="time-text">00:00</span>
            </div>
            <div class="inputs">
              <div class="field">
                <label for="minutes">Minutes</label>
                <input type="number" id="minutes" min="0" max="999" placeholder="0">
              </div>
              <div class="field">
                <label for="seconds">Seconds</label>
                <input type="number" id="seconds" min="0" max="59" placeholder="0">
              </div>
            </div>
          </div>
          <div class="buttons">
            <button id="startBtn">Start</button>
            <button id="pauseBtn" disabled>Pause</button>
            <button id="resetBtn">Reset</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const minutesInput = document.getElementById('minutes');
  const secondsInput = document.getElementById('seconds');
  const display = document.getElementById('display');
  const timeText = document.querySelector('.time-text');
  const ringProgress = document.querySelector('.ring-progress');
  const RING_RADIUS = 112;
  const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');

  ringProgress.setAttribute('stroke-dasharray', RING_CIRCUMFERENCE.toFixed(2));
  ringProgress.setAttribute('stroke-dashoffset', RING_CIRCUMFERENCE.toFixed(2));

  let totalSeconds = 0;
  let remaining = 0;
  let intervalId = null;

  function formatTime(secs) {
    const m = Math.floor(secs / 60).toString().padStart(2, '0');
    const s = (secs % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateRing() {
    if (totalSeconds <= 0) {
      ringProgress.style.strokeDashoffset = RING_CIRCUMFERENCE.toFixed(2);
      return;
    }
    const progress = 1 - remaining / totalSeconds;
    const offset = RING_CIRCUMFERENCE * (1 - progress);
    ringProgress.style.strokeDashoffset = Math.max(0, offset).toFixed(2);
  }

  function updateDisplay() {
    timeText.textContent = formatTime(remaining);
    display.classList.toggle('done', remaining === 0 && intervalId === null && totalSeconds > 0);
    updateRing();
  }

  function tick() {
    remaining--;
    if (remaining <= 0) {
      clearInterval(intervalId);
      intervalId = null;
      remaining = 0;
      timeText.textContent = "Time's up!";
      display.classList.add('done');
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      minutesInput.disabled = false;
      secondsInput.disabled = false;
      updateRing();
      return;
    }
    updateDisplay();
  }

  startBtn.addEventListener('click', () => {
    if (intervalId !== null) return;
    const mins = Math.max(0, parseInt(minutesInput.value, 10) || 0);
    const secs = Math.max(0, Math.min(59, parseInt(secondsInput.value, 10) || 0));
    totalSeconds = mins * 60 + secs;
    remaining = totalSeconds;
    if (remaining <= 0) return;
    minutesInput.disabled = true;
    secondsInput.disabled = true;
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    display.classList.remove('done');
    updateDisplay();
    intervalId = setInterval(tick, 1000);
  });

  pauseBtn.addEventListener('click', () => {
    clearInterval(intervalId);
    intervalId = null;
    startBtn.disabled = false;
    pauseBtn.disabled = true;
  });

  resetBtn.addEventListener('click', () => {
    clearInterval(intervalId);
    intervalId = null;
    totalSeconds = 0;
    remaining = 0;
    minutesInput.disabled = false;
    secondsInput.disabled = false;
    minutesInput.value = '';
    secondsInput.value = '';
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    display.classList.remove('done');
    timeText.textContent = '00:00';
    updateRing();
  });
</script>
</body>
</html>
